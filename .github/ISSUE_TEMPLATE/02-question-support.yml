# SPDX-License-Identifier: GPL-2.0-or-later
name: Questions & Support
description: Ask about installation, compatibility, configuration, or using the Goodix driver
title: "[QUESTION] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for questions and support requests, rather than confirmed bugs.

        You may find an answer in the [README](https://github.com/sorguido/goodix-27c6-5125#readme), [installation guide](https://github.com/sorguido/goodix-27c6-5125/blob/main/docs/INSTALLATION.md), [validation and limitations](https://github.com/sorguido/goodix-27c6-5125/blob/main/docs/VALIDATION.md), or [uninstall and recovery guide](https://github.com/sorguido/goodix-27c6-5125/blob/main/docs/UNINSTALL.md).

        This project targets Goodix USB `27c6:5125`; support for other devices, firmware revisions, and distributions should not be assumed. Never share pairing secrets, fingerprint data, raw USB captures, or private host state.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation / update
        - Hardware or firmware compatibility
        - Linux distribution / desktop compatibility
        - Enrollment / verification
        - Login / screen unlock / sudo
        - Uninstall / recovery
        - How the driver works
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Describe what you want to know or need help with
      placeholder: "What would you like to ask?"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: System (if relevant)
      placeholder: "e.g. Fedora 44 KDE, GF_ST411SEC_APP_12509, Huawei MateBook D 15"

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: "What you have already tried, non-sensitive output, or related documentation"
